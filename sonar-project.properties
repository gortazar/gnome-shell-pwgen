# SonarQube Cloud analysis. Run by .github/workflows/ci.yml, which calls the shared
# workflow at gortazar/aideas/.github/workflows/sonar.yml@v1 — see
# https://github.com/gortazar/aideas/blob/main/ideas/quality-gate/README.md
sonar.projectKey=gortazar_gnome-shell-pwgen
sonar.organization=gortazar
sonar.sourceEncoding=UTF-8

# The extension is flat at the repository root, so sources are named file by file rather
# than as a directory: anything else would sweep in tests/, ci/ and node_modules.
sonar.sources=extension.js,prefs.js,lib
sonar.tests=tests,ci

# No coverage report. This is GJS: the suite runs under gjs, not node, and there is no
# instrumentation story for it — so Sonar will read coverage on new code as 0%, which is
# recorded as such rather than papered over. See ideas/quality-gate/baseline.md.
