name: CI

on:
  push:
    branches: [main]
  pull_request:
  # New GNOME releases are what break extensions, and they land without us
  # touching the repo. Run weekly so a break shows up on its own.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

jobs:
  syntax:
    name: Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # GJS is not on the runner and the files import resource:/// URIs that only
      # exist inside gnome-shell, so this is a parse check only. Real loading is
      # covered by the shell job below.
      - name: Parse extension.js and prefs.js
        run: |
          for f in extension.js prefs.js; do
            cp "$f" "/tmp/${f%.js}.mjs"
            node --check "/tmp/${f%.js}.mjs"
            echo "$f: syntax OK"
          done
      - name: Validate gschema
        run: |
          sudo apt-get update && sudo apt-get install -y libglib2.0-bin
          glib-compile-schemas --strict --dry-run schemas/

  shell:
    name: GNOME Shell (${{ matrix.image }})
    runs-on: ubuntu-latest
    # Backstop: a shell that will not start has hung a job here before. Passing
    # jobs finish in about two minutes.
    timeout-minutes: 15
    container:
      image: ${{ matrix.image }}
      # Start from a clean /run. Note this is not by itself enough to keep
      # /run/systemd/seats away -- the package install below recreates it on this
      # tmpfs -- so it is deleted explicitly afterwards.
      options: --tmpfs /run
    strategy:
      fail-fast: false
      matrix:
        # Fedora ships one GNOME per release, so the image tag picks the version:
        #   fedora:40 -> 46   fedora:41 -> 47   fedora:42 -> 48   fedora:43 -> 49
        # Each job prints the exact version it got, so the mapping never has to be
        # trusted. Add the next tag when it ships.
        image:
          - fedora:40
          - fedora:41
          - fedora:42
          - fedora:43
        include:
          # Rawhide tracks the next GNOME before release. It is the early warning,
          # so it must not gate the build when it breaks for unrelated reasons.
          - image: fedora:rawhide
            experimental: true
    continue-on-error: ${{ matrix.experimental == true }}
    steps:
      - name: Install GNOME Shell and test dependencies
        run: |
          dnf -y install gnome-shell pwgen glib2 dbus-daemon procps-ng git
          gnome-shell --version
      - uses: actions/checkout@v4
      - name: Prepare the runtime environment
        run: |
          # Installing the systemd package recreates /run/systemd/seats, and it
          # does so *inside* the tmpfs above because packages are installed at run
          # time rather than baked into the image. Its mere presence makes the
          # shell choose its systemd login manager and abort on unreachable
          # logind, so it has to go after the install, not before.
          ls -la /run/systemd 2>/dev/null || echo "/run/systemd absent"
          rm -rf /run/systemd
          # The shell reads keyboard settings off the system bus at startup and
          # dies if it cannot reach one, even though nothing answers those calls.
          mkdir -p /run/dbus
          dbus-daemon --system --fork
      # mutter refuses to run as root, and CI containers are root by default.
      - name: Create unprivileged test user
        run: |
          useradd -m tester
          chown -R tester "$GITHUB_WORKSPACE"
      - name: Smoke test
        run: su tester -c "cd '$GITHUB_WORKSPACE' && ./ci/smoke-test.sh"
